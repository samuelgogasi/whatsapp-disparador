name: Android APK de homologacao
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-homologacao
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compilar e verificar Android
        run: gradle -p mobile/android --no-daemon --max-workers=2 assembleDebug lintDebug
      - name: Preparar artefato
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk artifacts/em-pauta-homologacao.apk
          sha256sum artifacts/em-pauta-homologacao.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: em-pauta-homologacao-apk
          path: artifacts/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: mobile/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
