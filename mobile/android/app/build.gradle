plugins { id 'com.android.application' }

android {
    namespace 'br.com.empauta.disparador'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'br.com.empauta.disparador.homologacao'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-homologacao'
        buildConfigField 'String', 'SERVER_URL', '"https://whatsapp-homologacao-disparador.ngof2y.easypanel.host/"'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'androidx.activity:activity:1.11.0' }
